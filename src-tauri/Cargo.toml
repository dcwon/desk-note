[package]
name = "desk-note"
version = "0.1.0"
description = "A lightweight desktop sticky-note todo app"
authors = ["Desk Note"]
edition = "2021"

[lib]
name = "desk_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "desk-note"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
